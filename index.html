<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Life Dashboard</title>

  <!-- SEO -->
  <meta name="description" content="A clean productivity dashboard with a live clock, focus timer, task list, and quick links — all in your browser, no server needed.">
  <meta name="author" content="Farrel Dimitri">
  <meta name="keywords" content="todo, productivity, pomodoro, focus timer, dashboard, task manager">

  <!-- Open Graph (social sharing preview) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Todo Life Dashboard">
  <meta property="og:description" content="A clean productivity dashboard with a live clock, focus timer, task list, and quick links — all in your browser, no server needed.">
  <meta property="og:url" content="https://farrel-dimitri.github.io/CodingCamp-5October2026-FarrelDimitri/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Todo Life Dashboard">
  <meta name="twitter:description" content="A clean productivity dashboard with a live clock, focus timer, task list, and quick links — all in your browser, no server needed.">

  <!-- Favicon (inline SVG as data URI — no extra file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">

  <link rel="stylesheet" href="css/style.css">

  <!-- Apply saved theme before page renders to avoid flash of wrong theme -->
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>

<body>

  <!-- Error Toast Notification -->
  <div id="error-toast" class="error-toast" aria-live="assertive" hidden></div>

  <div class="container">

    <!-- ── Header: Clock, Greeting, Name Editor ── -->
    <header id="header-card" class="card">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>

      <div id="clock">00:00:00</div>
      <div id="date">Loading...</div>
      <div id="greeting">Hello, Friend!</div>

      <div class="name-editor">
        <input id="name-input" type="text" maxlength="50" placeholder="Your name...">
        <button id="name-save-btn" class="btn btn-primary">Save</button>
        <span id="name-error" class="field-error" hidden></span>
        <span id="name-confirm" class="field-confirm" hidden>Saved!</span>
      </div>
    </header>

    <!-- ── Main Grid: Timer + Tasks ── -->
    <main class="main-grid">

      <!-- Focus Timer -->
      <section id="timer-card" class="card">
        <h2 class="card-title">Focus Timer</h2>

        <div id="timer-display">25:00</div>
        <div id="timer-complete" class="timer-complete" hidden>Time's up!</div>

        <div class="timer-duration-row">
          <label for="duration-input">Duration (min)</label>
          <input id="duration-input" type="number" min="1" max="180" value="25">
          <span id="duration-error" class="field-error" hidden></span>
        </div>

        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">Start</button>
          <button id="timer-stop" class="btn btn-neutral">Stop</button>
          <button id="timer-reset" class="btn btn-neutral">Reset</button>
        </div>
      </section>

      <!-- Tasks -->
      <section id="tasks-card" class="card">
        <h2 class="card-title">Tasks</h2>

        <div class="task-add-row">
          <input id="task-input" type="text" maxlength="100" placeholder="Add a task...">
          <button id="task-add-btn" class="btn btn-primary">Add</button>
        </div>
        <span id="task-error" class="field-error" hidden></span>

        <ul id="task-list" aria-label="Task list"></ul>
      </section>

    </main>

    <!-- ── Footer: Quick Links ── -->
    <footer>
      <section id="links-card" class="card">
        <h2 class="card-title">Quick Links</h2>

        <div class="link-add-row">
          <input id="link-name-input" type="text" maxlength="100" placeholder="Display name...">
          <input id="link-url-input" type="url" placeholder="https://...">
          <button id="link-add-btn" class="btn btn-primary">Add Link</button>
        </div>
        <span id="link-error" class="field-error" hidden></span>

        <div id="links-list" class="links-list" aria-label="Quick links"></div>
      </section>
    </footer>

  </div>

  <script src="js/app.js"></script>

</body>

</html>
